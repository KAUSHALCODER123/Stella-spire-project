{% extends "base.html" %}
{% block title %}{{ title }} — SpireDossier{% endblock %}
{% block chrome %}
<div class="topbar"><div><div class="crumb">Workspace</div><h1>Something needs attention</h1></div></div>
{% endblock %}
{% block content %}
<div class="page" style="max-width:720px;">
  <div class="card reveal">
    <div class="card-body">
      <h2 style="font-size:18px;">{{ title }}</h2>
      <div class="notice warn" style="margin:14px 0 20px;">{{ detail }}</div>
      <a class="btn" href="/">Back to dashboard</a>
    </div>
  </div>
</div>
{% endblock %}
