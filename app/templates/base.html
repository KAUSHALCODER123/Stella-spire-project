<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SpireDossier{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ------------------------------------------------------------------
     SpireDossier design tokens.

     The palette is deliberately cool and restrained except for one warm
     accent: --quote. Evidence is the product, so evidence is the only
     thing allowed to be warm. Everything else stays out of its way.
     ------------------------------------------------------------------ */
  :root {
    --ink:        #14171C;
    --ink-2:      #3E4753;
    --ink-3:      #6B7583;
    --ink-4:      #98A1AF;
    --paper:      #FCFCFD;
    --field:      #F0F3F7;
    --rule:       #DCE2EA;
    --rule-soft:  #EBEFF4;
    --spire:      #1F3A5F;
    --spire-soft: #E7ECF3;
    --quote:      #8A6D1F;   /* the signature accent: evidence */
    --quote-soft: #FBF6E9;

    --strong:  #17714F;
    --partial: #96660A;
    --absent:  #9B3535;

    --display: "Newsreader", Georgia, "Times New Roman", serif;
    --body: "Inter", "Segoe UI", -apple-system, system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;

    --pad: clamp(20px, 4vw, 44px);
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.55;
    font-feature-settings: "cv05" 1;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--spire); text-underline-offset: 2px; }

  :focus-visible { outline: 2px solid var(--spire); outline-offset: 2px; border-radius: 2px; }

  /* --- utility type ---------------------------------------------------- */
  .eyebrow {
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-4);
  }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* --- chrome ---------------------------------------------------------- */
  header.top {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 0 var(--pad); height: 56px;
    border-bottom: 1px solid var(--rule);
    background: rgba(252,252,253,.92);
    backdrop-filter: saturate(180%) blur(8px);
    position: sticky; top: 0; z-index: 20;
  }
  .wordmark {
    font-family: var(--display); font-size: 20px; font-weight: 600;
    letter-spacing: -0.015em; color: var(--ink); text-decoration: none;
    display: flex; align-items: baseline; gap: 9px;
  }
  .wordmark .sub {
    font-family: var(--mono); font-size: 10px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--ink-4); font-weight: 500;
  }
  .top-right { display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); }

  .dot { display: inline-flex; align-items: center; gap: 6px; }
  .dot::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--strong);
  }
  .dot.off::before { background: var(--absent); }

  main { max-width: 1240px; margin: 0 auto; padding: var(--pad); }

  /* --- headings -------------------------------------------------------- */
  h1 { font-family: var(--display); font-weight: 500; letter-spacing: -0.02em; margin: 0; }
  h2 { margin: 0; }

  /* --- panel ----------------------------------------------------------- */
  .panel {
    background: #fff; border: 1px solid var(--rule); border-radius: 4px;
  }
  .panel > .panel-head {
    padding: 12px 18px; border-bottom: 1px solid var(--rule-soft);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .panel > .panel-body { padding: 18px; }

  /* --- the signature: evidence rail ------------------------------------ */
  .evidence {
    border-left: 2px solid var(--quote);
    background: var(--quote-soft);
    padding: 7px 12px;
    font-family: var(--display);
    font-style: italic;
    font-size: 14px;
    line-height: 1.5;
    color: #5C4813;
  }

  /* --- controls -------------------------------------------------------- */
  label.field-label {
    display: block; font-family: var(--mono); font-size: 10.5px; font-weight: 500;
    letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 7px;
  }
  .hint { font-size: 12.5px; color: var(--ink-4); line-height: 1.5; }

  input[type=file], textarea, select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 3px;
    font-family: var(--body); font-size: 13.5px; background: #fff; color: var(--ink);
  }
  textarea {
    min-height: 260px; resize: vertical;
    font-family: var(--mono); font-size: 12px; line-height: 1.6; color: var(--ink-2);
  }
  select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%),
           linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
           background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%;
           background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 34px; cursor: pointer; }
  input[type=file] { padding: 8px; font-size: 12.5px; cursor: pointer; }
  input[type=file]::file-selector-button {
    font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
    border: 1px solid var(--rule); background: var(--field); color: var(--ink-2);
    padding: 6px 12px; border-radius: 2px; margin-right: 11px; cursor: pointer;
  }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 20px; border-radius: 3px; border: 1px solid var(--ink);
    background: var(--ink); color: #fff; cursor: pointer;
    font-family: var(--body); font-size: 14px; font-weight: 600; text-decoration: none;
    transition: background .14s ease, border-color .14s ease, color .14s ease;
  }
  .btn:hover { background: var(--spire); border-color: var(--spire); }
  .btn.ghost { background: #fff; color: var(--ink); border-color: var(--rule); }
  .btn.ghost:hover { background: var(--field); color: var(--ink); border-color: var(--ink-4); }
  .btn.ghost[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.sm { padding: 7px 13px; font-size: 12.5px; }
  .btn[disabled], .btn.is-disabled { opacity: .38; pointer-events: none; }

  .check { display: flex; align-items: flex-start; gap: 9px; cursor: pointer; }
  .check input { width: auto; margin-top: 3px; accent-color: var(--spire); }
  .check .t { font-size: 13.5px; font-weight: 500; }

  /* --- notices --------------------------------------------------------- */
  .notice { padding: 12px 15px; border-radius: 3px; font-size: 13.5px; line-height: 1.55; border-left: 2px solid; }
  .notice.warn { background: var(--quote-soft); border-color: var(--partial); color: #5C4813; }
  .notice.info { background: var(--spire-soft); border-color: var(--spire); color: var(--spire); }
  .notice code {
    font-family: var(--mono); font-size: 11.5px; background: rgba(0,0,0,.055);
    padding: 1.5px 5px; border-radius: 2px;
  }

  footer.foot {
    border-top: 1px solid var(--rule); margin-top: 40px;
    padding: 20px var(--pad); color: var(--ink-4); font-size: 12.5px;
    display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
  @media (max-width: 860px) {
    header.top { height: auto; padding: 10px var(--pad); flex-wrap: wrap; }
  }
</style>
{% block head %}{% endblock %}
</head>
<body>
<header class="top">
  <a class="wordmark" href="/">SpireDossier <span class="sub">{{ agency }}</span></a>
  <div class="top-right">{% block status %}{% endblock %}</div>
</header>

{% block content %}{% endblock %}

<footer class="foot">
  <span>Every judgement carries the CV line it rests on.</span>
  <span>Timeline figures are computed, not generated.</span>
</footer>
</body>
</html>
