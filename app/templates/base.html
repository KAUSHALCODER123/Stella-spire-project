<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SpireDossier{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400;75..100,500;75..100,600;75..100,700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ==================================================================
     SpireDossier

     The metaphor is a CV marked up by an expert with a pen. Everything
     is cool, quiet and documentary -- slate ink, paper-white sheets on
     a desk-grey ground -- except one colour: --mark, a highlighter
     citron that appears NOWHERE but on text traced back to the source
     document. It is loud on purpose. A highlighter is supposed to be.
     ================================================================== */
  :root {
    --slate:    #1B1F26;
    --slate-2:  #454E5C;
    --slate-3:  #6E7887;
    --slate-4:  #99A3B0;

    --desk:      #E9EDF1;
    --sheet:     #FFFFFF;
    --rule:      #D3DAE2;
    --rule-soft: #E4E9EF;

    --spire:      #1F3A5F;
    --spire-soft: #E4EAF2;

    --mark:      #F2ED7E;   /* traced to source */
    --mark-hot:  #FFE64A;   /* the active trace */
    --mark-edge: #C8C02F;

    --strong:  #17714F;
    --partial: #96660A;
    --absent:  #9B3535;

    --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;

    --pad: clamp(18px, 3.4vw, 40px);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--desk);
    color: var(--slate);
    font-family: var(--body);
    font-size: 15.5px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--spire); text-underline-offset: 2px; }
  :focus-visible { outline: 2px solid var(--spire); outline-offset: 2px; border-radius: 2px; }

  /* --- type roles ------------------------------------------------------ */
  .eyebrow {
    font-family: var(--mono); font-size: 10px; font-weight: 500;
    letter-spacing: .16em; text-transform: uppercase; color: var(--slate-4);
  }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  h1, h2 { margin: 0; font-family: var(--display); font-weight: 600; letter-spacing: -0.02em; }

  /* --- chrome ---------------------------------------------------------- */
  header.top {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 0 var(--pad); height: 54px;
    background: var(--sheet); border-bottom: 1px solid var(--rule);
    position: sticky; top: 0; z-index: 30;
  }
  .wordmark {
    display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--slate);
    font-family: var(--display); font-size: 19px; font-weight: 700;
    font-stretch: 92%; letter-spacing: -0.015em;
  }
  .wordmark .sub {
    font-family: var(--mono); font-size: 9.5px; font-weight: 500;
    letter-spacing: .18em; text-transform: uppercase; color: var(--slate-4);
  }
  .top-right { display: flex; align-items: center; gap: 14px; font-family: var(--mono); font-size: 11px; color: var(--slate-3); }
  .dot { display: inline-flex; align-items: center; gap: 6px; }
  .dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--strong); }
  .dot.off::before { background: var(--absent); }

  main { max-width: 1320px; margin: 0 auto; padding: var(--pad); }

  /* --- sheets ---------------------------------------------------------- */
  .sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 3px; }
  .sheet > .head {
    padding: 11px 16px; border-bottom: 1px solid var(--rule-soft);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .sheet > .body { padding: 16px; }

  /* --- THE SIGNATURE: the highlighter ---------------------------------- */
  /* Marks in the source pane. The stroke is drawn on when a trace is
     activated, in the direction a hand would move a pen. */
  .src-mark {
    background: var(--mark);
    color: inherit;
    padding: 1px 0;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
    border-radius: 1px;
    transition: background .18s ease, box-shadow .18s ease;
  }
  .src-mark.is-active {
    background: var(--mark-hot);
    box-shadow: 0 0 0 3px rgba(255,230,74,.42);
    animation: stroke .42s cubic-bezier(.3,.9,.3,1) 1;
  }
  @keyframes stroke {
    from { background-image: linear-gradient(90deg, var(--mark-hot) 0 0); background-size: 0% 100%; background-repeat: no-repeat; }
    to   { background-image: linear-gradient(90deg, var(--mark-hot) 0 0); background-size: 100% 100%; background-repeat: no-repeat; }
  }

  /* A quote in the dossier pane. Underlined in highlighter, not filled --
     the fill belongs to the source. */
  .quote {
    font-family: var(--body); font-size: 14px; line-height: 1.5; color: var(--slate-2);
    background: none; border: 0; padding: 0; margin: 6px 0 0; text-align: left; width: 100%;
    cursor: pointer; display: block;
    border-left: 2px solid var(--mark-edge); padding-left: 10px;
  }
  .quote:hover { color: var(--slate); }
  .quote em { font-style: italic; }
  .quote.unverified { border-left-style: dashed; border-left-color: var(--absent); cursor: default; }

  .stamp {
    font-family: var(--mono); font-size: 9px; font-weight: 600; letter-spacing: .12em;
    padding: 1.5px 5px; border-radius: 2px; white-space: nowrap;
  }
  .stamp.traced     { background: var(--mark); color: #4A4708; }
  .stamp.brief      { background: var(--spire-soft); color: var(--spire); }
  .stamp.unverified { background: #F8E9E9; color: var(--absent); }
  .stamp.computed   { background: var(--spire-soft); color: var(--spire); }

  /* --- controls -------------------------------------------------------- */
  label.field-label {
    display: block; font-family: var(--mono); font-size: 10px; font-weight: 500;
    letter-spacing: .16em; text-transform: uppercase; color: var(--slate-3); margin-bottom: 7px;
  }
  .hint { font-size: 12.5px; color: var(--slate-4); line-height: 1.5; }

  input[type=file], textarea, select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 2px;
    font-family: var(--body); font-size: 13.5px; background: var(--sheet); color: var(--slate);
  }
  textarea { min-height: 250px; resize: vertical; font-family: var(--mono); font-size: 11.5px; line-height: 1.65; color: var(--slate-2); }
  select {
    appearance: none; cursor: pointer; padding-right: 34px;
    background-image: linear-gradient(45deg, transparent 50%, var(--slate-3) 50%),
                      linear-gradient(135deg, var(--slate-3) 50%, transparent 50%);
    background-position: calc(100% - 17px) 51%, calc(100% - 12px) 51%;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  }
  input[type=file] { padding: 7px; font-size: 12.5px; cursor: pointer; }
  input[type=file]::file-selector-button {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase;
    border: 1px solid var(--rule); background: var(--desk); color: var(--slate-2);
    padding: 6px 12px; border-radius: 2px; margin-right: 11px; cursor: pointer;
  }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 19px; border-radius: 2px; border: 1px solid var(--slate);
    background: var(--slate); color: #fff; cursor: pointer; text-decoration: none;
    font-family: var(--body); font-size: 14.5px; font-weight: 600;
    transition: background .14s ease, border-color .14s ease;
  }
  .btn:hover { background: var(--spire); border-color: var(--spire); }
  .btn.ghost { background: var(--sheet); color: var(--slate); border-color: var(--rule); }
  .btn.ghost:hover { background: var(--desk); color: var(--slate); border-color: var(--slate-4); }
  .btn.sm { padding: 7px 13px; font-size: 12.5px; }
  .btn[disabled] { opacity: .38; pointer-events: none; }

  .check { display: flex; align-items: flex-start; gap: 9px; cursor: pointer; }
  .check input { width: auto; margin-top: 3px; accent-color: var(--spire); }
  .check .t { font-size: 13.5px; font-weight: 600; }

  .notice { padding: 11px 14px; border-radius: 2px; font-size: 13.5px; line-height: 1.55; border-left: 2px solid; }
  .notice.warn { background: #FDF8E3; border-color: var(--partial); color: #5C4813; }
  .notice.info { background: var(--spire-soft); border-color: var(--spire); color: var(--spire); }
  .notice code { font-family: var(--mono); font-size: 11.5px; background: rgba(0,0,0,.055); padding: 1.5px 5px; border-radius: 2px; }

  footer.foot {
    border-top: 1px solid var(--rule); margin-top: 36px; padding: 18px var(--pad);
    color: var(--slate-4); font-size: 12.5px;
    display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
  }
  @media (max-width: 820px) {
    header.top { height: auto; padding: 9px var(--pad); flex-wrap: wrap; }
  }
</style>
{% block head %}{% endblock %}
</head>
<body>
<header class="top">
  <a class="wordmark" href="/">SpireDossier <span class="sub">{{ agency }}</span></a>
  <div class="top-right">{% block status %}{% endblock %}</div>
</header>

{% block content %}{% endblock %}

<footer class="foot">
  <span>Claims link to the line they came from.</span>
  <span>Timeline figures are computed, not generated.</span>
</footer>
</body>
</html>
