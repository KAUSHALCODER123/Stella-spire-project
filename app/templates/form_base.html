{% extends "base.html" %}
{% block head %}
<style>
  .formgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 18px; }
  .formgrid .full { grid-column: 1 / -1; }
  .fieldset + .fieldset { margin-top: 22px; padding-top: 22px; border-top: 1px solid var(--border-2); }
  .fieldset > .legend { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
  .fieldset > .sub { font-size: 12.5px; color: var(--ink-4); margin: 0 0 15px; }

  input[type=text], input[type=email], input[type=number], input[type=tel] {
    width: 100%; padding: 10px 13px; border: 1px solid var(--border); border-radius: var(--r-sm);
    font-family: var(--font); font-size: 14px; background: var(--surface); color: var(--ink);
    transition: border-color var(--fast) var(--ease), box-shadow var(--fast) var(--ease);
  }
  input:hover { border-color: var(--ink-4); }
  input:focus { outline: none; border-color: var(--primary-500); box-shadow: 0 0 0 3px var(--primary-50); }
  input::placeholder { color: var(--ink-4); }
  textarea.short { min-height: 84px; font-size: 14px; }

  .free {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600;
    color: var(--ok); background: var(--ok-50); padding: 3px 9px; border-radius: 6px;
  }
  .why {
    background: var(--primary-50); border: 1px solid var(--primary-100); border-radius: var(--r-sm);
    padding: 13px 16px; font-size: 13px; color: var(--primary); line-height: 1.55;
  }
  .why b { font-weight: 600; }

  .sticky-actions {
    display: flex; align-items: center; gap: 14px; margin-top: 22px; flex-wrap: wrap;
  }
  @media (max-width: 720px) {
    .formgrid { grid-template-columns: 1fr; }
    .sticky-actions .btn { width: 100%; }
  }
</style>
{% endblock %}
